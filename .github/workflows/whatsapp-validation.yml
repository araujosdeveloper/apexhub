name: Validação Apex WhatsApp

on:
  push:
    branches: [ci/whatsapp-validacao, main]
  pull_request:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm run check && npm test
        working-directory: backend
      - run: bash scripts/validate-mysql.sh
      - run: bash scripts/validate-whatsapp-upgrade.sh
