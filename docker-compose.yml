services:
  mysql:
    image: mysql:8.0
    container_name: saas_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: delivery_saas_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  n8n:
    image: n8nio/n8n:latest
    container_name: saas_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: saas_pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: 123456
      PMA_ARBITRARY: 1

volumes:
  mysql_data:
  n8n_data:
