<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="/apex-tokens.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliações dos clientes · Apex Delivery</title><link rel="stylesheet" href="/orders.css"><style>main{max-width:1050px;margin:auto}.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:22px;margin:20px 0}.metrics{display:flex;flex-wrap:wrap;gap:30px}.metrics strong{display:block;font-size:25px}.review{border-top:1px solid var(--border);padding:18px 0}.comment{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}select{padding:10px;border:1px solid var(--border);border-radius:8px}#message{min-height:24px}</style><link rel="stylesheet" href="/admin-theme.css" media="screen"><script src="/assisted-context.js"></script><script src="/frame-bridge.js"></script>  <meta name="description" content="Painel de gestão de pedidos, cardápio e operação de delivery da Apex Delivery.">

</head><body class="apex-view apex-view-reviews"><main><a href="/admin.html">← Voltar aos pedidos</a><h1>Avaliações dos clientes</h1><p id="message" role="status" aria-live="polite"></p><div id="content" hidden><section class="panel"><h2>Resumo de todas as avaliações da loja</h2><div class="metrics"><div>Avaliações<strong id="total"></strong></div><div>Nota média de 1 a 5<strong id="average"></strong></div><div>Notas 1 ou 2<strong id="low"></strong></div></div><p id="distribution"></p><p class="muted">O resumo considera toda a base, independente do filtro. Avaliações são vinculadas a pedidos concluídos e não são publicadas no cardápio.</p></section><section class="panel"><div class="actions"><label>Filtrar por nota <select id="rating"><option value="all">Todas</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></label><button id="refresh">Atualizar</button></div><div id="reviews"></div><div class="actions"><button id="previous" class="secondary">Anterior</button><span id="page"></span><button id="next" class="secondary">Próxima</button></div></section></div></main><script src="/reviews.js" defer></script></body></html>
