<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozinha</title><link rel="stylesheet" href="/orders.css"><script src="/orders.js" defer></script><link rel="stylesheet" href="/admin-theme.css" media="screen"><script src="/frame-bridge.js"></script></head>
<body class="apex-view apex-view-kitchen" data-view="kitchen"><div class="app-shell">
<div class="page-toolbar"><span id="company-name" hidden></span><a id="store-link" hidden></a><span id="subscription" hidden></span><div class="top-actions"><span id="connection" class="connection" role="status">Conectando…</span><button id="sound" class="secondary" type="button" aria-pressed="false">Ativar som</button><button id="refresh" type="button">Atualizar pedidos</button><button id="logout" hidden>Sair</button></div></div>
<main><div class="page-heading"><div><h1>Cozinha (KDS)</h1><p>Veja os itens e adicionais, prepare e marque os pedidos como prontos.</p></div><p id="last-sync">Aguardando primeira atualização</p></div>
<div id="error" class="notice error" role="alert" hidden></div><div id="feedback" class="notice" role="status" aria-live="polite" hidden></div>
<div id="new-orders" class="notice new-orders" role="status" hidden><strong>Novo pedido recebido</strong><button id="view-new" type="button">Ver novos pedidos</button></div>
<section id="stats" class="stats" aria-label="Resumo dos pedidos"><button data-filter="pending"><span>Novos</span><strong id="count-pending">0</strong></button><button data-filter="preparing"><span>Em preparo</span><strong id="count-preparing">0</strong></button><button data-filter="ready"><span>Prontos</span><strong id="count-ready">0</strong></button><button data-filter="delivering" class="manager-only"><span>Em entrega</span><strong id="count-delivering">0</strong></button></section>
<section class="filters" aria-label="Filtrar pedidos"><label>Buscar pedido ou cliente<input id="search" type="search" maxlength="80" placeholder="Número, nome ou telefone" autocomplete="off"></label><label>Etapa<select id="status-filter"><option value="active">Em andamento</option><option value="pending">Novos</option><option value="preparing">Em preparo</option><option value="ready">Prontos</option></select></label><label>Modalidade<select id="fulfillment-filter"><option value="all">Todas</option><option value="delivery">Delivery</option><option value="pickup">Retirada</option></select></label></section>
<div class="queue-heading"><p id="result-summary" aria-live="polite">Carregando pedidos…</p><span id="order-note">Pedidos ativos mais antigos primeiro</span></div>
<div id="orders-board" class="board" aria-busy="true"><p class="empty">Carregando pedidos…</p></div>
<div class="pagination"><button id="previous" class="secondary" type="button" disabled>← Anterior</button><span id="page-label">Página 1</span><button id="next" class="secondary" type="button" disabled>Próxima →</button></div>
</main></div><div id="print-ticket" aria-hidden="true"></div></body></html>
